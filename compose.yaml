name: oss-course
services:
  database:
    image: ${IMAGE_PREFIX:-ghcr.io/sjj124390/online-shopping}/database:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: deploy/docker/database.Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shop-root-demo-password}
      MYSQL_DATABASE: single_item_shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop-demo-password}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -ushop -Dsingle_item_shop -e 'SELECT 1 FROM seller LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/sjj124390/online-shopping}/backend:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/single_item_shop?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-shop-demo-password}
      PASSCODE_HMAC_KEY: ${PASSCODE_HMAC_KEY:-course-demo-hmac-key-persist-for-this-database}
      TZ: UTC
    depends_on:
      database:
        condition: service_healthy
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/sjj124390/online-shopping}/frontend:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5500}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  mysql-data:
