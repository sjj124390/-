<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#f6fbff"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="640" cy="150" r="70" fill="#fde68a" opacity="0.7"/>
  <path d="M0 640 Q200 600 400 640 T800 640 L800 800 L0 800 Z" fill="#dbeafe"/>
  <!-- wheels -->
  <g stroke="#111827" stroke-width="18" fill="none">
    <circle cx="250" cy="560" r="120"/>
    <circle cx="560" cy="560" r="120"/>
  </g>
  <g stroke="#9ca3af" stroke-width="4" fill="none">
    <circle cx="250" cy="560" r="96"/><circle cx="560" cy="560" r="96"/>
