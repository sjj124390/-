    <path d="M250 560 L340 400 L500 400 L560 560"/>
    <path d="M340 400 L430 560 L250 560"/>
    <path d="M500 400 L470 330"/>
  </g>
  <path d="M430 330 H540" stroke="#111827" stroke-width="16" stroke-linecap="round"/>
  <!-- saddle / pedal -->
  <path d="M300 370 H380" stroke="#111827" stroke-width="18" stroke-linecap="round"/>
  <circle cx="430" cy="560" r="26" fill="#111827"/>
  <path d="M430 560 L470 610" stroke="#111827" stroke-width="14" stroke-linecap="round"/>
  <!-- bag on rear -->
  <rect x="180" y="392" width="76" height="66" rx="12" fill="#f59e0b"/>
  <text x="400" y="760" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#64748b" text-anchor="middle">九成新 · 城市通勤山地车</text>
