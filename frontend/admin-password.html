<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>密码修改 · 卖家后台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h1 class="page-title" id="page-title">密码修改</h1>
        <div class="admin-user">
          <span class="avatar" id="seller-avatar">卖</span>
          <span id="seller-name">卖家</span>
          <button class="btn btn-ghost btn-sm" onclick="logout()">退出登录</button>
        </div>
      </header>

      <main class="admin-content">
        <section class="card card-pad" style="max-width: 480px">
          <h2 class="card-title">修改登录密码</h2>
          <form id="pw-form" novalidate>
            <div class="form-item">
              <label>账号</label>
              <input id="username" type="text" placeholder="卖家账号" autocomplete="username" />
            </div>
            <div class="form-item">
              <label>原密码</label>
              <input id="oldPassword" type="password" placeholder="请输入当前登录密码" autocomplete="current-password" />
            </div>
            <div class="form-item">
              <label>新密码</label>
              <input id="newPassword" type="password" placeholder="至少 6 位，建议字母与数字组合" autocomplete="new-password" />
            </div>
            <div class="form-item">
              <label>确认新密码</label>
              <input id="confirmPassword" type="password" placeholder="请再次输入新密码" autocomplete="new-password" />
            </div>
            <div class="form-error" id="pw-error"></div>
            <button type="submit" class="btn btn-primary" id="pw-submit">确认修改</button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-password.js"></script>
</body>
</html>
