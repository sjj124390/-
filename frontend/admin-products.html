<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品管理 · 卖家后台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h1 class="page-title" id="page-title">商品管理</h1>
        <div class="admin-user">
          <span class="avatar" id="seller-avatar">卖</span>
          <span id="seller-name">卖家</span>
          <button class="btn btn-ghost btn-sm" onclick="logout()">退出登录</button>
        </div>
      </header>

      <main class="admin-content">
        <section class="block">
          <div class="section-head">
            <div class="section-title">当前商品</div>
            <button class="btn btn-primary" id="btn-add">发布新商品</button>
          </div>
          <div class="card" id="current-box"></div>
        </section>

        <section class="block">
          <div class="section-head">
            <div class="section-title">历史商品</div>
            <button class="btn btn-ghost btn-sm" id="btn-refresh">刷新</button>
          </div>
          <div class="card" id="history-box" style="overflow: hidden"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-products.js"></script>
</body>
</html>
