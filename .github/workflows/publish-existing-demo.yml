name: Publish existing-feature demo cut
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-existing-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-pil
      - name: Create labeled demo video
        run: |
          python3 scripts/create-existing-demo-cards.py
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -t 4 -i video-output/intro.png \
            -i "Video Project 4.mp4" \
            -loop 1 -framerate 30 -t 4 -i video-output/outro.png \
            -filter_complex "[0:v]format=yuv420p[v0];[1:v]fps=30,format=yuv420p[v1];[2:v]format=yuv420p[v2];[v0][v1][v2]concat=n=3:v=1:a=0[out];[1:a]adelay=4000|4000,apad[a]" \
            -map "[out]" -map "[a]" -c:v libx264 -preset veryfast -crf 28 -c:a aac \
            -shortest video-output/existing-features-demo-cut.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 video-output/existing-features-demo-cut.mp4
          test -s video-output/existing-features-demo-cut.mp4
      - name: Publish clearly labeled video on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=existing-features-demo-20261111
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" video-output/existing-features-demo-cut.mp4 --clobber
          else
            gh release create "$tag" video-output/existing-features-demo-cut.mp4 \
              --title "在线购物系统 · 现有功能演示剪辑（非二次挑战实测）" \
              --notes "由仓库原有 Video Project 4.mp4 添加说明片头片尾剪辑而成，仅作现有功能演示；第二次挑战需求 A 实际操作仍待补录。"
          fi
          gh release view "$tag" --json url,assets
